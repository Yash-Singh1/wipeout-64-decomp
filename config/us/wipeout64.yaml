name: Wipeout 64 (USA)
sha1: 54e4795aba4fc326f79d0703ffdb51a212dd4b5c
options:
  basename: wipeout64
  target_path: orig/us/baserom.z64
  base_path: ../..
  platform: n64
  compiler: GCC
  asm_path: asm/us
  asset_path: assets/us
  src_path: src
  build_path: build/us
  ld_script_path: build/us/wipeout64.ld
  elf_path: build/us/wipeout64.elf
  ld_dependencies: true
  symbol_addrs_path: config/us/symbol_addrs.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.txt
  generate_asm_macros_files: true
  create_c_files: false
  disassemble_all: true
  make_full_disasm_for_code: true
  use_legacy_include_asm: false
  migrate_rodata_to_functions: false
  section_order: [.rodata, .text, .data, .bss]
  subalign: 4
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  named_regs_for_c_funcs: false
  gp_value: 0x0

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: boot
    type: code
    start: 0x1000
    vram: 0x80000400
    align: 4
    subsegments:
      - [0x1000, asm, crt0]

  - name: main
    type: code
    start: 0x10F4
    vram: 0x800004F4
    bss_size: 0x669F0
    subalign: 1
    subsegments:
      - [0x10F4, rodatabin, crt0_rodata]
      - [0x1100, rodata, main_rodata_pre_error]
      - [0x1640, .rodata, error]
      - [0x1648, rodatabin, error_rodata_pad]
      - [0x1650, rodata, main_rodata_pre_skeleton]
      - [0x1C28, .rodata, skeleton]
      - [0x1C33, rodatabin, skeleton_rodata_pad]
      - [0x1C40, rodata, main_rodata_post_skeleton]
      - [0x5660, textbin, rsp/rspboot_text]
      - [0x5730, textbin, rsp/n_aspMain_text]
      - [0x6550, textbin, rsp/gspF3DLX_fifo_text]
      - [0x7980, textbin, rsp/gspL3DEX_fifo_text]
      - [0x8970, textbin, rsp/gspS2DEX_fifo_text]
      - [0x9840, c, assert]
      - [0x9848, textbin, assert_pad]
      - [0x9850, asm, game_code_pre_heap]
      - [0xF51C, textbin, pad_f51c]
      - [0xF520, c, dheap]
      - [0xF950, asm, files]
      - [0xFD20, c, error]
      - [0xFE20, asm, game_code_pre_skeleton]
      - [0x1A380, c, skeleton]
      - [0x1AB8C, textbin, skeleton_text_pad]
      - [0x1AB90, asm, radscn]
      - [0x1B804, textbin, pad_1b804]
      - [0x1B810, asm, game_code_post_radscn]
      - [0x76CA0, asm, libultra]
      - [0x88910, databin, rsp/n_aspMain_data]
      - [0x88BD0, databin, rsp/gspF3DLX_fifo_data]
      - [0x893D0, databin, rsp/gspL3DEX_fifo_data]
      - [0x89BD0, databin, rsp/gspS2DEX_fifo_data]
      - [0x89F50, data, main_data]
      - { start: 0x992F0, type: bss, vram: 0x800986F0, name: main_bss }

  - name: code_pad
    type: bin
    start: 0x992F0

  - name: static_gfx
    type: bin
    start: 0x99300

  - name: assets
    type: bin
    start: 0x99550

  - name: rom_pad
    type: bin
    start: 0x7B6E20

  - [0x800000]
